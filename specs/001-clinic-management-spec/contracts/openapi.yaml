openapi: 3.0.3
info:
  title: MediCare Clinic Management API
  version: 0.1.0
  description: |
    Contract baseline for appointment, clinical, pharmacy, billing, reporting,
    and compliance workflows.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
  /appointments:
    post:
      summary: Create appointment with conflict prevention
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          description: Slot conflict
    get:
      summary: List appointments by role scope and filters
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
  /medical-records:
    post:
      summary: Create or append medical record version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicalRecordRequest'
      responses:
        '201':
          description: Medical record saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecord'
  /prescriptions/{id}/dispense:
    post:
      summary: Dispense prescription and update inventory
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Prescription dispensed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '422':
          description: Insufficient stock or invalid transition
  /payments:
    post:
      summary: Create invoice/payment transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  /reports/export/{format}:
    get:
      summary: Export operational report
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: format
          required: true
          schema:
            type: string
            enum: [pdf, csv, xlsx]
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Export generated
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /gdpr/export:
    post:
      summary: Export personal data package
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Export request accepted
  /gdpr/delete:
    post:
      summary: Request personal data deletion workflow
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Deletion workflow accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSession:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          required: [id, role, email]
          properties:
            id: { type: string, format: uuid }
            role: { type: string }
            email: { type: string, format: email }
    CreateAppointmentRequest:
      type: object
      required: [patientId, doctorId, appointmentDate, appointmentTime, type]
      properties:
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        appointmentDate: { type: string, format: date }
        appointmentTime: { type: string, pattern: '^([01]\\d|2[0-3]):([0-5]\\d)$' }
        type: { type: string, enum: [CONSULTATION, FOLLOW_UP, CHECK_UP] }
        notes: { type: string }
    Appointment:
      type: object
      required: [id, patientId, doctorId, appointmentDate, appointmentTime, status]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        appointmentDate: { type: string, format: date }
        appointmentTime: { type: string }
        status: { type: string, enum: [SCHEDULED, COMPLETED, CANCELLED, NO_SHOW] }
        reminderSent: { type: boolean }
    CreateMedicalRecordRequest:
      type: object
      required: [patientId, doctorId, visitDate, symptoms, diagnosis, treatment]
      properties:
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        visitDate: { type: string, format: date }
        symptoms: { type: string }
        diagnosis: { type: string }
        treatment: { type: string }
        vitalSigns:
          type: object
          additionalProperties: true
    MedicalRecord:
      type: object
      required: [id, patientId, doctorId, version]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        isConfidential: { type: boolean }
    Prescription:
      type: object
      required: [id, medicalRecordId, status]
      properties:
        id: { type: string, format: uuid }
        medicalRecordId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, DISPENSED, COMPLETED, CANCELLED] }
    CreatePaymentRequest:
      type: object
      required: [patientId, amount, paymentMethod]
      properties:
        patientId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        amount: { type: number, format: double, minimum: 0.01 }
        paymentMethod: { type: string, enum: [CASH, BANK_TRANSFER, CARD, INSURANCE] }
        description: { type: string }
    Payment:
      type: object
      required: [id, patientId, amount, status, invoiceNumber]
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        amount: { type: number, format: double }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, REFUNDED] }
        invoiceNumber: { type: string }
